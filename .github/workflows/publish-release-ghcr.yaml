name: Publish release to GitHub Packages

# Publishes a tagged release (container image + Helm chart) to this repository's
# GitHub Packages (GHCR). Triggered when a GitHub Release is created from a v* tag.
on:
  release:
    types:
      - created

env:
  REGISTRY: ghcr.io

jobs:
  publish-image:
    name: Publish container image
    if: startsWith(github.ref, 'refs/tags/v') == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=tag

      - name: Build and push operator docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-chart:
    name: Publish Helm chart
    if: startsWith(github.ref, 'refs/tags/v') == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Generate operator chart
        run: make helm

      - name: Compute registry namespace
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ${{ env.REGISTRY }} \
              --username ${{ github.actor }} \
              --password-stdin

      - name: Package and push chart
        run: |
          # Use the release tag (minus any leading "v") as the chart version and
          # app version so the published chart and operator image share the tag.
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out/chart
          helm package charts/temporal-operator \
            --destination out/chart \
            --version "$version" \
            --app-version "$GITHUB_REF_NAME"
          chart_pkg="$(ls out/chart/*.tgz)"
          helm push "$chart_pkg" oci://${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/temporal-operator-charts
