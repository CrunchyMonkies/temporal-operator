apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "temporal-operator.fullname" . }}-controller-manager
  labels:
    control-plane: controller-manager
  {{- include "temporal-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.manager.replicas }}
  selector:
    matchLabels:
      control-plane: controller-manager
    {{- include "temporal-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        control-plane: controller-manager
      {{- include "temporal-operator.selectorLabels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      containers:
      - args: {{- toYaml .Values.manager.args | nindent 8 }}
        {{- if .Values.manager.leaderElectionNamespace }}
        - --leader-election-namespace={{ .Values.manager.leaderElectionNamespace }}
        {{- end }}
        {{- if .Values.remote.enabled }}
        {{- /* --kubeconfig is registered by controller-runtime itself. */}}
        - --kubeconfig={{ include "temporal-operator.kubeconfigPath" . }}
        {{- if .Values.remote.kubeconfig.context }}
        - --kubeconfig-context={{ .Values.remote.kubeconfig.context }}
        {{- end }}
        {{- if .Values.remote.bootstrap.enabled }}
        - --bootstrap-manifests-dir={{ .Values.remote.bootstrapMountPath }}
        {{- end }}
        {{- end }}
        command:
        - /manager
        {{- with .Values.manager.env }}
        env: {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.manager.envFrom }}
        envFrom: {{- toYaml . | nindent 8 }}
        {{- end }}
        image: {{ .Values.manager.image.repository }}:{{ .Values.manager.image.tag | default .Chart.AppVersion }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - name: webhook-server
          {{- if .Values.webhook.containerPort }}
          containerPort: {{ .Values.webhook.containerPort }}
          {{- else }}
          containerPort: 9443
          {{- end }}
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources: {{- toYaml .Values.manager.resources | nindent 10 }}
        securityContext: {{- toYaml .Values.manager.containerSecurityContext | nindent 10 }}
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
        {{- if .Values.remote.enabled }}
        - mountPath: {{ .Values.remote.kubeconfig.mountPath }}
          name: watched-cluster-kubeconfig
          readOnly: true
        {{- if .Values.remote.bootstrap.enabled }}
        - mountPath: {{ .Values.remote.bootstrapMountPath }}
          name: bootstrap-manifests
          readOnly: true
        {{- end }}
        {{- end }}
        {{- with .Values.manager.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      imagePullSecrets: {{ .Values.imagePullSecrets | default list | toJson }}
      securityContext:
        runAsNonRoot: true
      {{- if .Values.webhook.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      serviceAccountName: {{ include "temporal-operator.fullname" . }}-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: webhook-server-cert
      {{- if .Values.remote.enabled }}
      - name: watched-cluster-kubeconfig
        secret:
          defaultMode: 420
          secretName: {{ .Values.remote.kubeconfig.secretName }}
      {{- if .Values.remote.bootstrap.enabled }}
      - name: bootstrap-manifests
        configMap:
          name: {{ include "temporal-operator.fullname" . }}-bootstrap-manifests
      {{- end }}
      {{- end }}
      {{- with .Values.manager.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      nodeSelector: {{ toYaml .Values.manager.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.manager.tolerations | nindent 8 }}
